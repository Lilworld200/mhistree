<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mhistree — visual preservation specimen (no authentication)</title>
<style>
@font-face{font-family:Manrope;src:url('/font.woff2') format('woff2');font-weight:200 800;font-display:swap}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Manrope,system-ui,sans-serif;color:#181818;background:#ececeb}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid currentColor;outline-offset:3px}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;position:relative}.card{width:100%;max-width:440px;padding:40px 32px;border:1px solid rgba(255,255,255,.8);border-radius:32px;background:linear-gradient(#fff,#fafafa);box-shadow:0 24px 48px #0006}.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}.brand img{height:54px;width:auto;object-fit:contain;margin-bottom:16px}.brand span{font-size:14.4px;opacity:.7;text-align:center}.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#f6f6f5;border:1px solid #ffffffcc;border-radius:999px;padding:4px;margin-bottom:28px}.tabs:before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(#242424,#0d0d0d);box-shadow:0 6px 12px #0004,inset 0 1px 1px #ffffff40}.tabs button{position:relative;z-index:1;padding:11px 0;border-radius:999px;font-weight:800;font-size:13px;color:#6e6e6e;background:none;border:0}.tabs button:first-child{color:white}form{display:flex;flex-direction:column;gap:14px}label{font-size:12.8px;font-weight:600;opacity:.8;display:block;margin-bottom:4px}input{width:100%;background:#f6f6f5;border:1px solid #ffffffcc;border-radius:999px;padding:13px 20px;font-size:14px;font-weight:600;outline:none;box-shadow:inset 0 1px 2px #ffffff80;color:#181818}input:focus{border-color:#347bdd}input::placeholder{color:#999}.password{position:relative}.password input{padding-right:48px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:inline-flex;padding:10px;border:0;border-radius:10px;background:none;color:#6e6e6e}.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid #ffffff24;font-size:13.5px;font-weight:600;background:linear-gradient(#242424,#0d0d0d);color:white;box-shadow:0 7px 15px #00000038,inset 0 1px 1px #ffffff47;margin-top:8px;width:100%;height:50px;padding:12px}.footer{margin-top:24px;text-align:center}.footer button{background:none;border:0;color:#6e6e6e;font-size:13.6px;padding:0;text-decoration:underline}.back{position:absolute;top:18px;left:18px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#181818;background:white;border:1px solid #ffffffcc;border-radius:999px;padding:10px 16px;box-shadow:0 3px 8px #0000000d}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style></head><body><main class="page"><p class="sr">Visual-only legacy sign-in reconstruction. No credentials are sent or saved. This is not the target contactless authentication design.</p><button class="back" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</button><section class="card"><div class="brand"><img src="/logo.png" alt="Mhistree"><span>Welcome back to your Patient Health Portal</span></div><div class="tabs" role="tablist" aria-label="Authentication mode specimen"><button type="button" role="tab" aria-selected="true">Sign In</button><button type="button" role="tab" aria-selected="false" aria-disabled="true">Sign Up</button></div><form onsubmit="event.preventDefault()"><div><label for="email">Email Address</label><input id="email" name="email" type="email" required placeholder="patient@example.com" autocomplete="off"></div><div><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" required placeholder="••••••••" autocomplete="off"><button class="eye" type="button" aria-label="Show password" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button class="primary" type="submit">Sign In to Mhistree</button></form><div class="footer"><button type="button">← Continue chatting as Guest</button></div></section></main></body></html>
